</script>

// ---- localStorage-backed storage shim (same API shape used during development) ----
window.storage = {
  get: async function (key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error('not found');
    return { key: key, value: v };
  },
  set: async function (key, value) {
    localStorage.setItem(key, value);
    return { key: key, value: value };
  },
  delete: async function (key) {
    localStorage.removeItem(key);
    return { key: key, deleted: true };
  },
  list: async function (prefix) {
    const keys = Object.keys(localStorage).filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
    return { keys: keys };
  }
};

function weekIngredients(weekIndex, overrides) {
  const start = weekIndex * 7;
  const end = Math.min(start + 6, PLAN_DAYS - 1);
  const set = new Set();
  for (let d = start; d <= end; d++) {
    const m = mealsForDay(d, overrides);
    [m.breakfast, m.lunch, m.snack, m.dinner].forEach(meal => meal.ing.forEach(i => set.add(i)));
  }
  const byCat = {};
  [...set].sort().forEach(name => { const cat = categoryOf(name); (byCat[cat] = byCat[cat] || []).push(name); });
  return byCat;
}

// ---- Lightweight SVG line chart (no external deps) ----
function MiniChart({ data, lines, height = 160, refLine }) {
  if (!data || data.length < 2) return null;
  const width = 400;
  const pad = { top: 10, right: 8, bottom: 20, left: 8 };
  let vals = [];
  data.forEach(d => lines.forEach(l => { if (d[l.key] != null) vals.push(d[l.key]); }));
  if (refLine != null) vals.push(refLine);
  if (!vals.length) return null;
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const pd = (max - min) * 0.18;
  min -= pd; max += pd;
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const x = i => pad.left + (i / (data.length - 1)) * plotW;
  const y = v => pad.top + plotH - ((v - min) / (max - min)) * plotH;
  const tickEvery = Math.max(1, Math.ceil(data.length / 5));
  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: height, display: 'block' }}>
      {refLine != null && <line x1={pad.left} x2={width - pad.right} y1={y(refLine)} y2={y(refLine)} stroke={TOKENS.ochre} strokeDasharray="4 4" strokeWidth="1.5" />}
      {lines.map(l => {
        const pts = data.map((d, i) => (d[l.key] != null ? `${x(i)},${y(d[l.key])}` : null)).filter(Boolean);
        if (pts.length < 2) return null;
        return <polyline key={l.key} points={pts.join(' ')} fill="none" stroke={l.color} strokeWidth={l.width || 2} strokeLinecap="round" strokeLinejoin="round" />;
      })}
      {lines.map(l => data.map((d, i) => d[l.key] != null ? <circle key={l.key + i} cx={x(i)} cy={y(d[l.key])} r={l.width && l.width > 2 ? 3 : 2} fill={l.color} /> : null))}
      {data.map((d, i) => (i === 0 || i === data.length - 1 || i % tickEvery === 0) ? (
        <text key={'t' + i} x={x(i)} y={height - 4} fontSize="9" fill={TOKENS.inkSoft} textAnchor="middle">{d.date}</text>
      ) : null)}
    </svg>
  );
}

function TrailProgress({ pct, startW, currentW, goalW }) {

  const pathD = 'M 10 90 C 60 90, 70 40, 130 55 S 220 20, 280 25 S 350 65, 390 15';

  const markerY = 90 - Math.sin((clamped / 100) * Math.PI * 0.9) * 70;
  return (
    <div style={{ background: TOKENS.trail, borderRadius: 20, padding: '22px 20px 16px', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, opacity: 0.08, background: 'radial-gradient(circle at 80% 0%, white, transparent 60%)' }} />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', position: 'relative' }}>
        <div>
          <div style={{ fontFamily: 'Inter', fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#BFE0D6' }}>La sente de mon poids idéal</div>
          <div style={{ fontFamily: 'Fraunces', fontWeight: 600, fontSize: 26, color: 'white', marginTop: 2 }}>{(startW - currentW).toFixed(1)} kg parcourus</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ fontFamily: 'Inter', fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: '#BFE0D6' }}>Objectif</div>
          <div style={{ fontFamily: 'Fraunces', fontWeight: 600, fontSize: 22, color: TOKENS.ochreSoft }}>{goalW} kg</div>
        </div>
      </div>
      <svg viewBox="0 0 400 110" style={{ width: '100%', height: 100, marginTop: 10 }}>
        <path d={pathD} fill="none" stroke="#3D7A6F" strokeWidth="4" strokeLinecap="round" />
        <path d={pathD} fill="none" stroke={TOKENS.ochre} strokeWidth="4" strokeLinecap="round" strokeDasharray="600" strokeDashoffset={600 - (clamped / 100) * 600} />
        <circle cx="10" cy="90" r="6" fill="white" />
        <circle cx="390" cy="15" r="6" fill="none" stroke="white" strokeWidth="2" />
        <g transform={`translate(${markerX}, ${markerY})`}><circle r="9" fill={TOKENS.ochre} stroke="white" strokeWidth="2.5" /></g>
      </svg>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'Inter', fontSize: 11, color: '#BFE0D6' }}>
        <span>Départ · {startW} kg</span><span>{clamped.toFixed(0)}% du chemin</span><span>Sommet · {goalW} kg</span>
      </div>
    </div>
  );
}

function ShareModal({ title, text, onClose }) {
  const [copied, setCopied] = useState(false);

    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); }

  return (
    <Modal title={title} onClose={onClose}>

    const since = addDays(todayISO(), -30);

    const weightDelta = wIn.length >= 2 ? +(wIn[wIn.length - 1].weight - wIn[0].weight).toFixed(1) : null;
    const weeksSpan = wIn.length >= 2 ? Math.max(1, daysBetween(wIn[0].date, wIn[wIn.length - 1].date) / 7) : null;
    const weeklyAvg = weightDelta !== null ? +(weightDelta / weeksSpan).toFixed(2) : null;

    const actIn = activityLog.filter(e => e.date >= since);
    const activeDays = actIn.filter(e => e.steps > 0 || e.note).length;

    const statusIn = Object.entries(dayStatus).filter(([d]) => d >= since);
    const suiviDays = statusIn.filter(([, v]) => v === 'suivi').length;

    function trend(log, key) {
      const inRange = log.filter(e => e.date >= since).sort((a, b) => new Date(a.date) - new Date(b.date));
      if (inRange.length < 2) return null;
      const diff = inRange[inRange.length - 1][key] - inRange[0][key];
      if (Math.abs(diff) < (key === 'sys' || key === 'total' ? 3 : 1)) return 'stable';
      return diff > 0 ? 'hausse' : 'baisse';
    }
    return {
      weeklyAvg, activeDays, suiviDays,
      tensionTrend: trend(tensionLog, 'sys'),
      cholesterolTrend: trend(cholesterolLog, 'total'),
    };

            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 12, color: TOKENS.inkSoft, marginBottom: 4 }}>Calories</div>
              <input type="text" inputMode="numeric" placeholder="250" value={foodKcal} onChange={e => setFoodKcal(e.target.value)} onKeyDown={e => e.key === 'Enter' && addFoodEntry()} style={inputStyle} />
            </div>
          </div>
          <div style={{ fontSize: 11, color: TOKENS.inkSoft, marginTop: 8 }}>
            Choisis une suggestion pour remplir les calories automatiquement, ou saisis-les toi-même si l'aliment n'est pas dans la liste.
          </div>
          <button onClick={addFoodEntry} style={btnStyle}>Ajouter · {nowHM()}</button>
        </Modal>
      )}

      {modal === 'recipes' && (
        <Modal title="Qu'as-tu à disposition pour cuisiner ?" onClose={() => setModal(null)}>
          <div style={{ fontSize: 12, color: TOKENS.inkSoft, marginBottom: 10 }}>Coche ce que tu as sous la main, les recettes possibles apparaissent en dessous.</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 16 }}>
            {INGREDIENT_OPTIONS.map(ing => {
              const active = myIngredients.indexOf(ing) >= 0;
              return (
                <button key={ing} onClick={() => setMyIngredients(active ? myIngredients.filter(x => x !== ing) : [...myIngredients, ing])} style={{
                  padding: '7px 12px', borderRadius: 20, fontSize: 12, fontWeight: 600, cursor: 'pointer',
                  border: `1.5px solid ${active ? TOKENS.trail : TOKENS.line}`,
                  background: active ? TOKENS.trailSoft : 'white', color: active ? TOKENS.trail : TOKENS.inkSoft,
                }}>{ing}</button>
              );
            })}
          </div>

          {myIngredients.length === 0 && (
            <div style={{ fontSize: 13, color: TOKENS.inkSoft, textAlign: 'center', padding: '10px 0' }}>Sélectionne au moins un ingrédient pour voir des idées.</div>
          )}

          {matchedRecipes.length === 0 && myIngredients.length > 0 && (
            <div style={{ fontSize: 13, color: TOKENS.inkSoft, textAlign: 'center', padding: '10px 0' }}>Aucune recette ne correspond pour l'instant — essaie d'ajouter d'autres ingrédients.</div>
          )}

          {matchedRecipes.map(({ recipe, missing }) => (
            <div key={recipe.name} style={{ background: missing.length === 0 ? TOKENS.trailSoft : TOKENS.bg, borderRadius: 12, padding: 12, marginBottom: 8 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontFamily: 'Fraunces', fontWeight: 700, fontSize: 14 }}>{recipe.name}</span>
                <span style={{ fontSize: 11, color: TOKENS.inkSoft }}>~{recipe.kcal} kcal</span>
              </div>
              {missing.length === 0 ? (
                <div style={{ fontSize: 11, color: TOKENS.trail, fontWeight: 600, marginTop: 3 }}>Tu as tout ce qu'il faut ✓</div>
              ) : (
                <div style={{ fontSize: 11, color: TOKENS.ochre, marginTop: 3 }}>Il manque : {missing.join(', ')}</div>
              )}
              <div style={{ fontSize: 12.5, marginTop: 6, color: TOKENS.ink }}>{recipe.steps}</div>
            </div>
          ))}
        </Modal>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
